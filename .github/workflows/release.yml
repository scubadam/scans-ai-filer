name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.10.2)'
        required: true
        default: 'v0.10.2'
      rebuild_ocr:
        description: 'Force rebuild of multi-arch OCR sidecar image'
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    name: Build & Publish Multi-Arch Image (amd64 / arm64) & Helm OCI Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build & Push Multi-Arch Main Container Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract OCR Sidecar Docker metadata
        id: meta-ocr
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}-ocr
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Detect whether OCR sidecar changed since previous tag
        id: ocr-check
        run: |
          OCR_REPO="ghcr.io/${{ github.repository }}-ocr"
          PREV_TAG=$(git tag --sort=-v:refname 'v*' | grep -v "^${GITHUB_REF_NAME}$" | head -n 1 || true)
          SRC_IMAGE=""
          REBUILD="false"

          if docker buildx imagetools inspect "${OCR_REPO}:latest" >/dev/null 2>&1; then
            SRC_IMAGE="${OCR_REPO}:latest"
          elif [[ -n "$PREV_TAG" ]] && docker buildx imagetools inspect "${OCR_REPO}:${PREV_TAG#v}" >/dev/null 2>&1; then
            SRC_IMAGE="${OCR_REPO}:${PREV_TAG#v}"
          fi

          if [[ "${{ github.event.inputs.rebuild_ocr }}" == "true" ]]; then
            echo "Forced OCR rebuild requested."
            REBUILD="true"
          elif [[ -z "$SRC_IMAGE" ]]; then
            echo "No existing OCR manifest found; full OCR build required."
            REBUILD="true"
          elif [[ -n "$PREV_TAG" ]]; then
            CHANGED=$(git diff --name-only "$PREV_TAG..HEAD" -- Dockerfile.ocr cmd/ocr-server/ || true)
            if [[ -n "$CHANGED" ]]; then
              echo "OCR files changed since $PREV_TAG:"
              echo "$CHANGED"
              REBUILD="true"
            else
              echo "No OCR changes since $PREV_TAG; will fast re-tag $SRC_IMAGE."
            fi
          fi
          echo "rebuild=$REBUILD" >> "$GITHUB_OUTPUT"
          echo "src_image=$SRC_IMAGE" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (only when OCR sidecar rebuilds)
        if: steps.ocr-check.outputs.rebuild == 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Build & Push Multi-Arch OCR Sidecar Image
        if: steps.ocr-check.outputs.rebuild == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile.ocr
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-ocr.outputs.tags }}
          labels: ${{ steps.meta-ocr.outputs.labels }}
          cache-from: type=gha,scope=ocr
          cache-to: type=gha,scope=ocr,mode=max

      - name: Fast Re-tag Existing Multi-Arch OCR Sidecar Manifest
        if: steps.ocr-check.outputs.rebuild != 'true'
        env:
          OCR_TAGS: ${{ steps.meta-ocr.outputs.tags }}
          SRC_IMAGE: ${{ steps.ocr-check.outputs.src_image }}
        run: |
          ARGS=()
          while IFS= read -r tag; do
            [[ -z "$tag" || "$tag" == "$SRC_IMAGE" ]] && continue
            ARGS+=(-t "$tag")
          done <<< "$OCR_TAGS"
          if [[ ${#ARGS[@]} -gt 0 ]]; then
            echo "Re-tagging $SRC_IMAGE -> ${ARGS[*]}"
            docker buildx imagetools create "${ARGS[@]}" "$SRC_IMAGE"
          fi

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5

      - name: Package & Push Helm Chart to GHCR OCI
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF_TYPE" == "tag" && -n "$TAG_VER" ]]; then
            CHART_VER="$TAG_VER"
            helm package charts/scans-ai-filer --version "$CHART_VER" --app-version "$CHART_VER"
          else
            CHART_VER=$(grep '^version:' charts/scans-ai-filer/Chart.yaml | awk '{print $2}')
            helm package charts/scans-ai-filer
          fi
          echo "Pushing Helm Chart version $CHART_VER..."
          echo ${{ secrets.GITHUB_TOKEN }} | helm registry login ghcr.io --username ${{ github.actor }} --password-stdin
          helm push scans-ai-filer-${CHART_VER}.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
