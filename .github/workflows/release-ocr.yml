name: Release OCR Sidecar

on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile.ocr'
      - 'cmd/ocr-server/**'
    tags:
      - 'ocr-v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional extra tag to publish (e.g. 0.10.1)'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  build-ocr:
    name: Build & Publish Multi-Arch OCR Sidecar Image (amd64 / arm64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract OCR Sidecar Docker metadata
        id: meta-ocr
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}-ocr
          tags: |
            type=raw,value=latest
            type=ref,event=tag
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' }}

      - name: Build & Push Multi-Arch OCR Sidecar Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile.ocr
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-ocr.outputs.tags }}
          labels: ${{ steps.meta-ocr.outputs.labels }}
          cache-from: type=gha,scope=ocr
          cache-to: type=gha,scope=ocr,mode=max
