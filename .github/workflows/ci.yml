name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Vet, Unit & Integration Tests, Multi-Arch Compile & Helm Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Enforce DevContainer & CI Version Sync
        run: |
          source .devcontainer/.env
          echo "Verified DevContainer GO_DEV_IMAGE: $GO_DEV_IMAGE"

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: '1.27'
          cache: true

      - name: Run go vet
        run: go vet ./...

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Run Unit Tests with Race Detector
        run: go test -v -race ./internal/...

      - name: Run E2E Integration Tests with Race Detector
        run: go test -tags=integration -v -race ./tests/integration/...

      - name: Verify Multi-Arch Static Binary Compiles (amd64 + arm64)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o /tmp/scans-ai-filer-amd64 ./cmd/filer
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o /tmp/scans-ai-filer-arm64 ./cmd/filer
          ls -lh /tmp/scans-ai-filer-*

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5

      - name: Lint Helm Chart
        run: helm lint charts/scans-ai-filer
