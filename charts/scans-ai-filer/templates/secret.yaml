{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "scans-ai-filer.secretName" . }}
  labels:
    {{- include "scans-ai-filer.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.secrets.geminiApiKeyKey }}: {{ .Values.secrets.geminiApiKey | quote }}
  {{ .Values.secrets.gdriveSaJsonKey }}: {{ .Values.secrets.gdriveSaJson | quote }}
{{- end }}
