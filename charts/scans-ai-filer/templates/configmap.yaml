{{- if and (not .Values.taxonomy.existingConfigMap) .Values.taxonomy.inlineCsv }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "scans-ai-filer.fullname" . }}-taxonomy
  labels:
    {{- include "scans-ai-filer.labels" . | nindent 4 }}
data:
  {{ .Values.taxonomy.key }}: |
    {{- .Values.taxonomy.inlineCsv | nindent 4 }}
{{- end }}
