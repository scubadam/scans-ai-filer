{{- if and .Values.webUI.enabled (eq .Values.workloadMode "deployment") }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "scans-ai-filer.fullname" . }}
  labels:
    {{- include "scans-ai-filer.labels" . | nindent 4 }}
spec:
  type: {{ .Values.webUI.service.type }}
  ports:
    - port: {{ .Values.webUI.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "scans-ai-filer.selectorLabels" . | nindent 4 }}
{{- end }}
