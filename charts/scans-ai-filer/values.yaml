image:
  repository: ghcr.io/scubadam/scans-ai-filer
  tag: "" # Defaults to Chart appVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

schedule: "*/10 * * * *"
concurrencyPolicy: Forbid
successfulJobsHistoryLimit: 3
failedJobsHistoryLimit: 3
backoffLimit: 1
activeDeadlineSeconds: 1800

config:
  storageProvider: "gdrive"
  aiProvider: "gemini"
  geminiModel: "gemini-2.5-flash"
  # Optional multi-inbox routing, e.g. "Inbox:gemini,Inbox-Local:ollama"
  inboxRoutes: ""
  ollamaBaseUrl: "http://ollama-service.default.svc.cluster.local:11434/v1"
  ollamaModel: "qwen2.5vl:3b"
  ollamaTextModel: ""
  ollamaMaxPages: 5
  ollamaMaxImageDim: 1536
  ollamaTimeoutSeconds: 300
  # Optional pure-Go SQLite + vector search taxonomy store (set persistence.enabled=true to persist)
  taxonomyDbPath: ""
  embeddingProvider: "auto" # auto | ollama | gemini | none
  embeddingModel: ""
  taxonomyTopK: 8
  scansFolderName: "Scans"
  inboxFolderName: "Inbox"
  batchSize: 15
  pauseSeconds: 1
  dryRun: false
  webhookUrl: ""

secrets:
  # Recommended: manage credentials via SOPS/ExternalSecrets and reference existingSecret
  existingSecret: ""
  geminiApiKeyKey: "GEMINI_API_KEY"
  gdriveSaJsonKey: "gdrive-sa.json"
  # Optional: key in existingSecret holding the AES-256 PDF encryption passphrase
  pdfPasswordKey: "PDF_PASSWORD"
  # Inline values (only used when existingSecret is empty)
  geminiApiKey: ""
  gdriveSaJson: ""
  pdfPassword: ""

taxonomy:
  # Optional: reference an existing ConfigMap containing a taxonomy.csv key
  existingConfigMap: ""
  key: "taxonomy.csv"
  # Optional: inline CSV seed (leave empty to use fallback/AI-inferred categories or bootstrap from existing storage with --bootstrap-taxonomy)
  # Example:
  # inlineCsv: |
  #   Category,Subcategory,Organization,Keywords,Path_Template,Description
  #   Utilities,Energy,Example Energy,"electric, gas, tariff",Utilities/Energy/Example Energy/{year},Energy supplier bills
  #   Finance,Banking,Example Bank,"bank statement, current account",Finance/Banking/Example Bank/{year},Bank statements
  #   Healthcare,Medical Records,General Hospital,"appointment, clinic, hospital",Healthcare/Medical Records/General Hospital/{year},Hospital letters
  inlineCsv: ""

persistence:
  # Enable a PersistentVolumeClaim to persist the pure-Go SQLite vector taxonomy DB (taxonomy.db)
  enabled: false
  existingClaim: ""
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 1Gi
  mountPath: /var/lib/scans-ai-filer
  annotations: {}

resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    cpu: 500m
    memory: 256Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}
